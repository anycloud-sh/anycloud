{{- include "anycloud-api.requireValues" . -}}
# The API's cluster authority. The hosted API applies its own release, runs
# host steps on the management Node and observes both through this
# ServiceAccount; no credential for it is stored or exported (ARCHITECTURE.md,
# "Cluster authority").
apiVersion: v1
kind: ServiceAccount
metadata:
  name: anycloud-api
  labels:
    {{- include "anycloud-api.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: anycloud-api
  labels:
    {{- include "anycloud-api.labels" . | nindent 4 }}
rules:
  # Identity (kube-system UID) and the release's namespaces.
  - apiGroups: ['']
    resources: ['namespaces']
    verbs: ['get', 'create', 'patch', 'delete']
  # The management Node's label.
  - apiGroups: ['']
    resources: ['nodes']
    verbs: ['get', 'patch']
  # Release material.
  - apiGroups: ['']
    resources: ['secrets', 'serviceaccounts']
    verbs: ['get', 'list', 'watch', 'create', 'patch', 'delete']
  # Release, hook and host-step Pods, their logs and events, for diagnostics.
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['']
    resources: ['pods/log']
    verbs: ['get']
  - apiGroups: ['']
    resources: ['events']
    verbs: ['list']
  # The API's own rollout.
  - apiGroups: ['apps']
    resources: ['deployments']
    verbs: ['get', 'list', 'watch']
  # Release hook and host-step Jobs.
  - apiGroups: ['batch']
    resources: ['jobs']
    verbs: ['get', 'list', 'create', 'patch', 'delete']
  # Registry add-ons (kube-system) and the API's own release.
  - apiGroups: ['helm.cattle.io']
    resources: ['helmcharts', 'helmchartconfigs']
    verbs: ['get', 'create', 'update', 'patch', 'delete']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: anycloud-api
  labels:
    {{- include "anycloud-api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: anycloud-api
subjects:
  - kind: ServiceAccount
    name: anycloud-api
    namespace: {{ .Release.Namespace }}
---
# Every role connection's trust must refuse this ServiceAccount's token; the
# save-time check proves it (RFC 0047 § Save-time check). It has no other use
# or permission, and no Pod mounts it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: anycloud-trust-probe
  labels:
    {{- include "anycloud-api.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# Role connections exchange the API's own token, bound to each cloud's
# audience, for cloud sessions (RFC 0047 amendments 8 and 9), and the trust
# probe's token to prove each trust pins its subject.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: anycloud-api-token
  labels:
    {{- include "anycloud-api.labels" . | nindent 4 }}
rules:
  - apiGroups: ['']
    resources: ['serviceaccounts/token']
    resourceNames: ['anycloud-api', 'anycloud-trust-probe']
    verbs: ['create']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: anycloud-api-token
  labels:
    {{- include "anycloud-api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: anycloud-api-token
subjects:
  - kind: ServiceAccount
    name: anycloud-api
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: anycloud-api-observer
  labels:
    {{- include "anycloud-api.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: anycloud-api-observer
  labels:
    {{- include "anycloud-api.labels" . | nindent 4 }}
rules:
  - apiGroups: ['apps']
    resources: ['deployments']
    resourceNames: ['anycloud-api']
    verbs: ['get']
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: anycloud-api-observer
  labels:
    {{- include "anycloud-api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: anycloud-api-observer
subjects:
  - kind: ServiceAccount
    name: anycloud-api-observer
    namespace: {{ .Release.Namespace }}
