name: Runner image

# Builds the Dockerfile's runner check stages for each image platform, so a
# runner that fails on one (the ARM64 patchelf crash) fails here, not in a
# Release. Release is the only other Dockerfile build.
on:
  pull_request:
    paths:
      - Dockerfile
      - 'src/runner/**'
      - yarn.lock
      - .github/workflows/runner-image.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - 'src/runner/**'
      - yarn.lock
      - .github/workflows/runner-image.yml

permissions:
  contents: read
  packages: read

jobs:
  runner-check:
    name: Runner check (${{ matrix.platform }})
    runs-on: ${{ (vars.CI_BACKEND == 'hosted' || github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && matrix.runner || matrix.native || 'backmesh-4' }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          # backmesh runners are x86, so ARM64 builds natively on either backend.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            native: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build the runner check stages
        run: |
          docker buildx build --platform ${{ matrix.platform }} --target runner-check \
            --build-arg DEPS_FULL_IMAGE="$(bash scripts/resolve-deps-image.sh full)" .
