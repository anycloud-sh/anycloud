name: E2E Claim Burst

# S12: 1,000+ pool Jobs on about 20 runner replicas, then 200 and 500
# managed replicas on KWOK, against a 2 vCPU / 4 GiB management node. Its own
# workflow: it loads its runner host for about an hour, which made a
# neighbouring job's load-sensitive gate fail when it ran on every PR.
# It runs nightly, on dispatch, and on PRs that touch the claim path.
on:
  pull_request:
    paths:
      - '.github/workflows/e2e-claim-burst.yml'
      - 'src/runner/**'
      - 'src/api/rpc/deployment-workload.ts'
      - 'src/api/rpc/request-budget.ts'
      - 'src/shared/api-contract/deployment-workload.ts'
      - 'src/api/services/api-authentication.ts'
      - 'src/api/services/deployment-replicas.ts'
      - 'src/api/services/deployment-workload-domain.ts'
      - 'src/api/services/deployment-controller.ts'
      - 'src/api/services/job-changes.ts'
      - 'src/api/services/request-budget.ts'
      - 'src/api/services/spend-controls.ts'
      - 'src/api/services/repositories/claim-spend-gate.ts'
      - 'src/api/services/repositories/db.ts'
      - 'src/api/services/repositories/deployment-executions.ts'
      - 'src/api/services/repositories/workload-attempts.ts'
      - 'test/integration/run-constrained-vitest.sh'
      - 'test/integration/e2e/internal/context.ts'
      - 'test/integration/e2e/internal/local-api-process.ts'
      - 'test/integration/e2e/internal/contracts/claim-burst.ts'
      - 'test/integration/e2e/internal/substrates/local-cluster/**'
      - 'test/integration/e2e/specs/e2e-claim-burst-local.spec.ts'
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  e2e-claim-burst-local:
    runs-on: ${{ (vars.CI_BACKEND == 'hosted' || github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-24.04' || 'backmesh-8' }}
    # Measured (run 39858018602): setup ~8 min, the burst ~15 min, both KWOK
    # levels ~30 min with cleanup; the burst has 30 min, each level 5 and its
    # cleanup 5.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Initialize claim burst artifact directories
        shell: bash
        run: |
          echo "E2E_RESULTS_ROOT=$RUNNER_TEMP/e2e-claim-burst-local-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: ${{ vars.CI_BACKEND == 'hosted' && 'yarn' || '' }}

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: bash scripts/ci-install-dependencies.sh

      - name: Generate deterministic Python SDK
        env:
          PYTHON_BIN: python3
        run: yarn generate:python-sdk

      - name: Build
        run: yarn build

      - name: Run claim burst E2E
        id: tests
        run: |
          docker info
          nproc
          yarn test:e2e-claim-burst-local:vitest

      - name: Retain claim burst container logs
        id: retain-claim-burst-logs
        if: failure() || cancelled()
        continue-on-error: true
        run: |
          mkdir -p "$E2E_RESULTS_ROOT/retained-containers"
          for id in $(docker ps -aq --filter label=com.anycloud.e2e-cluster-local=true); do
            name="$(docker inspect --format '{{.Name}}' "$id" | sed 's#^/##')"
            docker logs "$id" > "$E2E_RESULTS_ROOT/retained-containers/$name.log" 2>&1 || true
          done

      - name: Delete retained claim burst resources
        if: always()
        run: |
          docker ps -aq --filter label=com.anycloud.e2e-cluster-local=true | xargs -r docker rm -f
          docker network ls -q --filter label=com.anycloud.e2e-cluster-local=true | xargs -r docker network rm

      # The contract record holds the burst's and each KWOK level's numbers.
      - name: Upload claim burst records
        if: success() && steps.tests.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-claim-burst-local-records-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.E2E_RESULTS_ROOT }}/e2e-results-e2e-claim-burst-local-vitest-*/e2e-run.json
            ${{ env.E2E_RESULTS_ROOT }}/e2e-results-e2e-claim-burst-local-vitest-*/vitest-fixture/**/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload claim burst E2E logs
        if: failure() || cancelled() || contains(steps.*.outcome, 'failure')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-e2e-claim-burst-local
          path: |
            ${{ env.E2E_RESULTS_ROOT }}/
            /tmp/anycloud-e2e-artifacts/
          retention-days: 3
