name: Mutant Survivors

# Advisory: mutates the src/ lines a PR changes and comments the mutants no
# unit test detects. It is not a required check, and every step but the
# evidence upload continues on error, so it doesn't fail the PR.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['src/**']

permissions: {}

concurrency:
  group: mutant-survivors-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mutate:
    if: >-
      ${{ !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ${{ vars.CI_BACKEND == 'hosted' && 'ubuntu-latest' || 'backmesh-4' }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        id: checkout
        continue-on-error: true
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        continue-on-error: true
        with:
          node-version: '22'
          cache: ${{ vars.CI_BACKEND == 'hosted' && 'yarn' || '' }}
      # A failed checkout leaves no pull request tree to mutate.
      - name: Mutate the changed lines
        id: diff
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 25
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          bash scripts/ci-install-dependencies.sh
          node test/mutant-parity/src-parity.mjs diff "$BASE_SHA"
      # A failure or timeout becomes the report.
      - name: Report
        continue-on-error: true
        env:
          OUTCOME: ${{ steps.diff.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report=reports/mutation/src-parity/diff/report.md
          if [[ "$OUTCOME" != success ]]; then
            mkdir -p "$(dirname "$report")"
            echo "The mutant check didn't finish ($OUTCOME); see [the run]($RUN_URL). For a large change, dispatch the Mutant Parity workflow instead." > "$report"
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: implementation-evidence-mutant-survivors
          path: |
            reports/mutation/src-parity/diff/report.md
            reports/mutation/src-parity/diff/head.json
          if-no-files-found: error
          retention-days: 30

  # Only this job can write, and it never checks out or runs the PR's code.
  comment:
    needs: mutate
    runs-on: ${{ vars.CI_BACKEND == 'hosted' && 'ubuntu-latest' || 'backmesh-2' }}
    permissions:
      pull-requests: write
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: implementation-evidence-mutant-survivors
          path: survivors
      - uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const marker = '<!-- mutant-survivors -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let report = require('fs').readFileSync('survivors/report.md', 'utf8');
            // GitHub refuses comments over 65,536 characters; cut at a line end.
            if (report.length > 60000) {
              report = `${report.slice(0, 60000).replace(/\n[^\n]*$/, '')}\n\n_Truncated; see the report in [the run's artifact](${run})._`;
            }
            const head = context.payload.pull_request.head.sha.slice(0, 9);
            const body = `${marker}\n### Mutant survivors on changed lines at \`${head}\` (advisory)\n\n${report}`;
            const issue = { ...context.repo, issue_number: context.payload.pull_request.number };
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const sticky = comments.find(
              (c) => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker),
            );
            if (sticky) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: sticky.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }
