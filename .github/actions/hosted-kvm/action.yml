name: Hosted KVM access
description: >-
  Make /dev/kvm readable and writable on a GitHub-hosted runner, which exposes
  KVM but not to the runner user. Self-hosted KVM runners already grant it.

runs:
  using: composite
  steps:
    - if: runner.environment == 'github-hosted'
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
