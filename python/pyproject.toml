[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anycloud-sdk"
version = "0.1.80"
description = "Generated Python client for the AnyCloud API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.28.1,<1",
    "pydantic>=2.11,<3",
    "python-dateutil>=2.8.2,<3",
    "typing-extensions>=4.12.2,<5",
]

[project.urls]
Homepage = "https://anycloud.sh/"
Documentation = "https://anycloud.sh/getting-started/"
"Python SDK reference" = "https://anycloud.sh/reference/python-sdk/"

[tool.hatch.build.targets.wheel]
packages = ["generated/anycloud", "extensions/anycloud_workflows"]

[tool.hatch.build.targets.wheel.force-include]
"package-data/anycloud/py.typed" = "anycloud/py.typed"

[tool.hatch.build.targets.sdist]
include = [
    "/generated/anycloud",
    "/extensions/anycloud_workflows",
    "/examples/async_deployment_submission.py",
    "/examples/job_completion.py",
    "/package-data/anycloud/py.typed",
    "/README.md",
    "/pyproject.toml",
]

# The repository's LICENSE and NOTICE; the wheel, built from the sdist,
# finds them at its root.
[tool.hatch.build.targets.sdist.force-include]
"../LICENSE" = "LICENSE"
"../NOTICE" = "NOTICE"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
]
