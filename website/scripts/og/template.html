<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>anycloud — OG</title>
    <style>
      :root {
        --bg: #0a0f1c;
        --bg-soft: #0f172a;
        --ink: #f1f5f9;
        --ink-soft: #94a3b8;
        --ink-mute: #64748b;
        --accent: #22d3ee;
        --accent-2: #67e8f9;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .frame {
        position: relative;
        width: 1200px;
        height: 630px;
        background:
          radial-gradient(
            900px 520px at 78% 12%,
            rgba(34, 211, 238, 0.18),
            transparent 60%
          ),
          radial-gradient(
            720px 480px at 18% 88%,
            rgba(14, 116, 144, 0.22),
            transparent 60%
          ),
          linear-gradient(180deg, #0a0f1c 0%, #070b16 100%);
        overflow: hidden;
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(
            to right,
            rgba(148, 163, 184, 0.05) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(148, 163, 184, 0.05) 1px,
            transparent 1px
          );
        background-size: 48px 48px;
        mask-image: radial-gradient(
          800px 500px at 50% 40%,
          #000 0%,
          transparent 70%
        );
      }

      .brand {
        position: absolute;
        top: 56px;
        left: 72px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 32px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .brand .emoji {
        font-family:
          'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
        font-size: 38px;
        line-height: 1;
      }

      .headline {
        position: absolute;
        left: 72px;
        right: 72px;
        top: 176px;
        font-size: 72px;
        line-height: 1.02;
        letter-spacing: -0.035em;
        font-weight: 700;
        color: var(--ink);
        max-width: 1060px;
      }

      .points {
        position: absolute;
        left: 72px;
        right: 72px;
        top: 450px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        max-width: 1056px;
      }
      .point {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 30px;
        line-height: 1.2;
        color: var(--ink-soft);
        font-weight: 400;
      }
      .point .ico {
        font-family:
          'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
        font-size: 30px;
        line-height: 1;
        flex: none;
      }
      .point b {
        color: var(--ink);
        font-weight: 600;
      }

      .foot {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 20px;
        color: var(--ink-soft);
      }
      .foot .url {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--ink);
        font-weight: 500;
      }
      .foot .url .emoji {
        font-family:
          'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
        font-size: 22px;
      }
      .foot .chips {
        color: var(--ink-mute);
        letter-spacing: 0.02em;
      }
      .foot .chips .accent {
        color: var(--accent);
      }

      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 4px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          var(--accent) 30%,
          var(--accent-2) 70%,
          transparent 100%
        );
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="grid"></div>

      <div class="brand">
        <span class="emoji">☁️</span>
        <span>anycloud</span>
      </div>

      <h1 class="headline">CLI for any AI workload in any cloud account</h1>

      <div class="points">
        <div class="point">
          <span class="ico">🤖</span>
          <span>For people <b>· AI agents</b></span>
        </div>
        <div class="point">
          <span class="ico">🔐</span>
          <span>One CLI across <b>your cloud accounts</b></span>
        </div>
      </div>

      <div class="foot">
        <div class="url">
          <span class="emoji">☁️</span>
          <span>anycloud.sh</span>
        </div>
        <div class="chips">
          your accounts <span class="accent">·</span> your infrastructure
          <span class="accent">·</span> your data
        </div>
      </div>

      <div class="bar"></div>
    </div>
  </body>
</html>
